[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "backend"
path = "src/main.rs"

[dependencies]
actix-cors = "0.7.2"
actix-web = "4.15.0"
chrono = "0.4"
dotenvy = "0.15.7"
futures = "0.3.34"
jsonwebtoken = "11.1.0"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "native-tls"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
tokio = "1.53.1"
tokio-util = "0.7.19"
